name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v2

      - name: PHPのセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2.12"
          extensions: mbstring, pdo, mysql, json
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      - name: PHP依存関係のインストール
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v2
        with:
          node-version: "20.11.0"

      - name: Node.js依存関係のインストール
        run: npm install

      - name: フロントエンドのビルド
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: インスタンス1にデプロイ
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.AWS_EC2_HOST_1 }}
          username: ${{ secrets.AWS_EC2_USER_1 }}
          key: ${{ secrets.AWS_EC2_SSH_KEY_1 }}
          script: |
            cd /var/www/html/MoodTune
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            npm ci
            npm run build
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo service php8.2-fpm restart

      - name: インスタンス2にデプロイ
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.AWS_EC2_HOST_2 }}
          username: ${{ secrets.AWS_EC2_USER_1 }}
          key: ${{ secrets.AWS_EC2_SSH_KEY_1 }}
          script: |
            cd /var/www/html/MoodTune
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            npm ci
            npm run build
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo service php8.2-fpm restart
